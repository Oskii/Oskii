<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" role="img" aria-label="Oscar Chambers (Oskii) — AI, Protocol &amp; Software Security">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="55%" stop-color="#0f131a"/>
      <stop offset="100%" stop-color="#131924"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="920" height="220" rx="14" fill="url(#bg)" stroke="#21262d" stroke-width="1.5"/>
  <rect width="920" height="220" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="920" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Top terminal status bar -->
  <circle cx="38" cy="34" r="4.5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="38" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="1.4">
    SECURITY RESEARCH &amp; PROTOCOL AUDITING // HACKERBANE.COM
  </text>
  <text x="884" y="38" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    AI · CLOUD · L1 PROTOCOLS
  </text>

  <!-- Main Heading -->
  <text x="34" y="88" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.6">
    Oscar Chambers
  </text>
  <text x="308" y="88" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="500">
    @Oskii
  </text>

  <!-- Subtitle -->
  <text x="34" y="118" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Advisor @ Hackerbane · Offensive Security &amp; Protocol Engineer · White-Hat Researcher
  </text>
  <text x="34" y="142" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">
    Finding and patching high-impact vulnerabilities across AI agent runtimes, robotics SDKs, LLM stacks, and L1 blockchains.
  </text>

  <!-- Divider -->
  <line x1="34" y1="164" x2="886" y2="164" stroke="#21262d" stroke-width="1"/>

  <!-- Proof pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#e6edf3">
    <rect x="34" y="177" width="84" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="76" y="194" text-anchor="middle">AWS (3x)</text>

    <rect x="126" y="177" width="96" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="174" y="194" text-anchor="middle">Anthropic</text>

    <rect x="230" y="177" width="102" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="281" y="194" text-anchor="middle">Google ADK</text>

    <rect x="340" y="177" width="134" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="407" y="194" text-anchor="middle">Boston Dynamics</text>

    <rect x="482" y="177" width="108" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="536" y="194" text-anchor="middle">NVIDIA garak</text>

    <rect x="598" y="177" width="96" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="646" y="194" text-anchor="middle">Mistral AI</text>

    <rect x="702" y="177" width="74" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="739" y="194" text-anchor="middle">vLLM</text>

    <rect x="784" y="177" width="102" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="835" y="194" text-anchor="middle">geth &amp; reth</text>
  </g>
</svg>
